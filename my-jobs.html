<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="application-name" content="Workspace"><title>My jobs | Promo Kings Workspace</title><link rel="icon" href="images/promo-kings-logo.svg"><link rel="stylesheet" href="css/styles.css"><link rel="stylesheet" href="css/polish.css"></head>
<body>
  <header id="app-header" class="topbar"></header>
  <main class="page">
    <div class="page-heading"><div><p class="eyebrow">RIDER WORKSPACE</p><h1>My jobs</h1><p class="muted">Your assigned pickup and dropoff queue.</p></div>
      <label class="inline-label">Show<select id="my-jobs-filter"><option value="active">Not finished</option><option value="finished">Finished</option><option value="all">All jobs</option></select></label>
    </div>
    <section class="panel"><div class="section-heading"><h2>My activity</h2><label class="inline-label">Period<select id="jobs-period"><option value="day">Day</option><option value="week">Week</option><option value="month">Month</option></select></label></div><div id="jobs-tallies" class="stats-grid"></div></section>
    <section class="panel"><div id="my-jobs-list" class="rider-job-list"></div><p id="my-jobs-empty" class="empty-state hidden">No jobs match this filter.</p><button type="button" class="secondary hidden" id="my-jobs-more">Load more</button></section>
  </main>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script type="module" src="js/app.js"></script>
</body>
</html>
