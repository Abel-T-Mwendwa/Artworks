<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Design | Promo Kings Artwork Tracker</title><link rel="icon" href="images/promo-kings-logo.svg"><link rel="stylesheet" href="css/styles.css"><link rel="stylesheet" href="css/polish.css"></head>
<body>
  <header class="topbar"><a class="wordmark" href="designer.html"><img class="company-logo" src="images/promo-kings-logo.svg" alt="Promo Kings logo" hidden></a><button class="mobile-menu-button" type="button" data-menu-toggle aria-expanded="false">Menu</button><div class="top-actions"><button id="change-bell" class="quiet" aria-label="Open change requests">♧ Changes <b id="change-count">0</b></button><button id="assignment-bell" class="quiet" aria-label="Open new assignments">New assignments <b id="assignment-count">0</b></button><span id="current-user"></span><button class="quiet" data-logout>Log out</button></div></header>
  <main class="page">
    <div class="page-heading"><div><p class="eyebrow">DESIGN WORKSPACE</p><h1>Work queue</h1><p class="muted">Claim a job to start work and keep its sales team informed.</p></div></div>
    <section class="panel"><div id="designer-tallies" class="stats-grid"></div></section>
    <section class="panel"><div class="section-heading"><h2>Artwork queue</h2><select id="designer-filter"><option value="">All jobs</option><option value="today">Needed today</option><option value="tomorrow">Needed tomorrow</option><option value="pending">Pending</option><option value="done">Done</option><option value="changes">Change requests</option><option value="assignments">New assignments</option></select></div>
      <div id="assignment-banner" class="notice assignment-notice hidden"></div>
      <div id="change-banner" class="notice hidden"></div>
      <div class="table-wrap"><table><thead><tr><th data-sort="ref_no">Ref / client</th><th>Request details</th><th>Needed</th><th>Salesperson</th><th>Status</th><th>Change requested</th><th>Work notes / final file</th><th>Designer preferred</th><th>Actions</th></tr></thead><tbody id="designer-rows"></tbody></table></div>
      <p id="designer-empty" class="empty-state hidden">No jobs match this filter.</p>
    </section>
  </main>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <script src="config.js"></script><script src="js/logo.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script type="module" src="js/app.js"></script>
</body>
</html>
